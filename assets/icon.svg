<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 256 256" role="img" aria-labelledby="title description">
  <title id="title">Ratatouille — крыса-повар</title>
  <desc id="description">Собственный персонаж: крыса с большими ушами, вытянутой мордочкой, белым поварским колпаком и красным шейным платком на кремовом фоне.</desc>
  <rect width="256" height="256" fill="#F6EAD6"/>
  <g stroke="#29251F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- Уши расположены внутри безопасной области круглого аватара. -->
    <path d="M94 123C88 98 69 91 54 102C37 115 42 145 61 153C74 158 87 147 94 123Z" fill="#B7A493"/>
    <path d="M162 122C169 97 189 94 202 106C218 121 210 148 193 154C179 159 167 146 162 122Z" fill="#B7A493"/>
    <path d="M76 116C61 107 53 123 63 136" fill="none" stroke="#C34C37" stroke-width="9"/>
    <path d="M183 117C197 111 203 128 192 138" fill="none" stroke="#C34C37" stroke-width="9"/>
    <!-- Красный платок остаётся различимым при уменьшении. -->
    <path d="M103 192L95 213L117 209L128 221L140 210L163 213L152 190Z" fill="#C34C37"/>
    <!-- Вытянутая мордочка и крупный нос отличают крысу от круглой мыши. -->
    <path d="M90 110C72 131 76 157 91 175L109 198C119 211 140 210 150 197L168 173C184 151 180 127 164 110C145 91 107 92 90 110Z" fill="#B7A493"/>
    <path d="M105 166C111 159 121 160 128 168C136 160 146 159 152 166C157 173 147 194 129 198C111 194 99 174 105 166Z" fill="#F6EAD6" stroke="none"/>
    <!-- Три крупные доли колпака, без тонких складок. -->
    <path d="M94 86C69 82 70 54 88 47C93 45 98 45 102 47C105 24 136 20 149 39C172 33 187 50 179 69C176 78 168 84 159 86L157 108H99Z" fill="#FFFCF6"/>
    <path d="M99 87H158" fill="none"/>
    <path d="M103 108H153" fill="none"/>
    <!-- Лицо: большие простые знаки без мелких бликов. -->
    <path d="M99 137L110 134M145 134L155 137" fill="none" stroke-width="5"/>
    <g fill="#29251F" stroke="none">
      <ellipse cx="108" cy="149" rx="4.5" ry="6"/>
      <ellipse cx="148" cy="149" rx="4.5" ry="6"/>
      <path d="M117 175C117 167 139 166 140 174C141 180 133 186 129 186C124 186 117 181 117 175Z"/>
    </g>
    <path d="M129 186V190M117 190Q129 200 142 189" fill="none" stroke-width="5"/>
    <path d="M97 169L82 166M99 181L84 184M159 169L175 166M157 181L172 185" fill="none" stroke-width="5"/>
  </g>
</svg>
