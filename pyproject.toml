[project]
name = "ratatouille"
version = "0.1.0"
description = "Telegram Mini App for weekly meal planning"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
  "aiogram>=3.31,<4",
  "alembic>=1.15,<2",
  "fastapi>=0.115,<1",
  "icalendar>=7,<8",
  "pydantic>=2.13,<3",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2.13,<3",
  "mypy>=1.15,<2",
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ratatouille"]

[tool.hatch.build.targets.wheel.force-include]
"data/starter_recipes.json" = "ratatouille/data/starter_recipes.json"

[tool.pytest.ini_options]
testpaths = ["tests", "tools/publication"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py", "migrations/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests", "migrations"]
strict = true
